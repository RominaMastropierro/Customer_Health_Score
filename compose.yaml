# Ejecución endurecida de Customer Health Score. Los números de regla corresponden al
# OWASP Docker Security Cheat Sheet.
#   docker compose up -d --build   ->  http://127.0.0.1:8080
name: health-score

# Endurecimiento común a ambos servicios
x-hardening: &hardening
  init: true                            # recoge procesos zombi y reenvía señales
  user: "10001:10001"                   # [#2] coincide con el Dockerfile
  read_only: true                       # [#8] sistema de archivos raíz inmutable
  cap_drop: [ALL]                       # [#3] ningún servicio necesita capabilities
  security_opt:
    - no-new-privileges:true            # [#4]
    # se mantienen seccomp/AppArmor por defecto; nunca usar *=unconfined  [#6]
  pids_limit: 200                       # [#7] protección contra fork bombs
  ulimits:
    nofile: { soft: 1024, hard: 2048 }  # [#7]
  restart: on-failure:5                 # [#7] reinicios acotados
  logging:                              # [#10] logs a stdout/stderr con rotación
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  api:
    <<: *hardening
    build:
      context: .
      target: api
    image: health-score-api:${VERSION:-dev}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m   # [#8]
    volumes:
      # Única ruta escribible persistente: la base SQLite (y sus archivos -journal)  [#8]
      - dbdata:/var/lib/health-score
      # Permite cambiar pesos/umbrales sin reconstruir (editar y reiniciar); solo lectura  [#8]
      - ./config/scoring.json:/app/config/scoring.json:ro
      # Prompt del resumen del BCRA: se ajusta y se aplica con `docker compose restart api`  [#8]
      - ./config/prompts/bcra-summary.md:/app/config/prompts/bcra-summary.md:ro
    environment:
      # Es la ruta del secreto, no la clave  [#13]
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [anthropic_api_key]          # [#13] API key de Claude (spec 005)
    mem_limit: 512m                     # [#7]
    memswap_limit: 512m                 # [#7] sin swap
    cpus: "1.0"                         # [#7]
    # Sin `ports:`: la API solo es accesible desde la red interna, a través de web  [#5]
    # `egress` le da salida a internet para consultar al BCRA y a Claude (spec 005)  [#5]
    networks: [backend, egress]

  web:
    <<: *hardening
    build:
      context: .
      target: web
    image: health-score-web:${VERSION:-dev}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m   # [#8] pid y temporales de nginx
    mem_limit: 128m                     # [#7]
    memswap_limit: 128m                 # [#7]
    cpus: "0.5"                         # [#7]
    ports:
      - "127.0.0.1:8080:8080"           # [#5] solo loopback; en producción, proxy TLS delante
    networks: [frontend, backend]
    depends_on:
      api:
        condition: service_healthy

networks:
  frontend: {}
  backend:
    internal: true                      # [#5] sin salida a internet e inaccesible desde fuera
  # EXCEPCIÓN documentada (spec 005, research R13; SECURITY-DOCKER.md)  [#5]: red con salida
  # a internet solo para `api`. Compose no puede limitarla por dominio, así que `api` puede
  # salir a cualquier destino, no solo a api.bcra.gob.ar y api.anthropic.com. En producción,
  # usar un proxy de salida con lista de dominios permitidos o reglas de firewall del host.
  egress: {}

volumes:
  dbdata: {}

# API key de Claude (spec 005): archivo local fuera del repositorio (secrets/ está en
# .gitignore y .dockerignore), montado en /run/secrets/anthropic_api_key. Nunca en variables
# de entorno, ARG ni en la imagen  [#13]
secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt

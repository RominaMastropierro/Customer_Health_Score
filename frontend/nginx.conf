# nginx del contenedor web: sirve el bundle de Vite y reenvía /api a la API.
# Corre como UID 10001 con FS raíz de solo lectura: todo lo escribible va a /tmp (tmpfs)  [#2, #8]
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr info;   # nivel al menos INFO, a stderr  [#10]

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Mismo contrato que el proxy de Vite: /api/x -> http://api:8000/x
        location /api/ {
            proxy_pass http://api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Por encima del tiempo límite del dashboard con Ollama en CPU (compose.ollama.yaml);
            # con el valor por defecto (60 s) nginx cortaría la consulta al BCRA antes.
            proxy_read_timeout 120s;
        }

        # La SPA usa rutas con hash, pero se cae a index.html por si acaso
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "health-score"
version = "0.1.0"
description = "Motor de scoring de salud de clientes"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "sqlalchemy>=2.0",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
